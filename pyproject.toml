[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketflow"
version = "0.1.0"
description = "MCP ticket-tracker server and a Claude-backed intake workflow with a mock mode."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Harkaran Singh" }]
dependencies = [
    "mcp>=2.0,<3",
    "anthropic>=0.75",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-html>=4.2",
    "ruff>=0.17",
    "anyio>=4.0",
]

[project.scripts]
ticketflow-server = "ticketflow.server:main"
ticketflow-agent = "ticketflow.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--junitxml=reports/junit.xml",
    "--html=reports/report.html",
    "--self-contained-html",
]
junit_family = "xunit2"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
